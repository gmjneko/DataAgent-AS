server.port=8080

spring.application.name=data-agent-management

management.endpoints.web.exposure.include=health

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/data_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password@mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=io.github.malonetalk.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Model Configuration
io.github.malonetalk.model.provider=openai
io.github.malonetalk.model.name=deepseek-flash
io.github.malonetalk.model.base-url=https://api.deepseek.com
io.github.malonetalk.model.api-key=sk-xxxxxxxxx
io.github.malonetalk.model.thinking-enabled=true

spring.config.import=classpath:skill.properties

# Auth Configuration: local values are configured directly below.
# JWT secret must be >= 32 bytes in production; blank => in-memory random key (dev only, tokens invalidated on restart).
jwt.secret=data-agent-secret-key
jwt.expiration-hours=24
# Initial admin password for first startup when sys_user is empty; fail-closed if unset.
admin.init-password=password

# AgentScope 2.x: single backend instance; back up both MySQL state and this workspace.
agentscope.workspace=.agentscope/workspace
agentscope.state-table=agentscope_agent_state
agentscope.max-iters=1024
agentscope.trigger-messages=128
agentscope.keep-messages=127
agentscope.trigger-tokens=32000
agentscope.max-tool-result-chars=80000
agentscope.mcp-enabled=true
